    // ==========================================
    // 4. ONLINE BOOKING WIZARD VIEW
    // ==========================================
    function BookingView({ services, bookings, selectedService, onBookingCreated, settings }) {
      const [step, setStep] = useState(1);
      
      // Form fields
      const [chosenService, setChosenService] = useState(selectedService || services[0] || null);
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedTime, setSelectedTime] = useState('16:00');
      const [customerName, setCustomerName] = useState('');
      const [phone, setPhone] = useState('');
      const [notes, setNotes] = useState('');

      const [phoneError, setPhoneError] = useState('');
      const [confirmedBooking, setConfirmedBooking] = useState(null);

      // Egyptian phone validation logic
      const validateEgyptianPhone = (num) => {
        const regex = /^01[0125][0-9]{8}$/;
        return regex.test(num);
      };

      // Slots generation logic
      const availableTimeSlots = useMemo(() => {
        const times = ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00', '23:00'];
        // Filter out times already booked on selectedDate
        const bookedTimesOnDate = bookings
          .filter(b => b.date === selectedDate && b.status !== 'ملغي')
          .map(b => b.time);

        return times.map(t => ({
          time: t,
          isBooked: bookedTimesOnDate.includes(t)
        }));
      }, [selectedDate, bookings]);

      const handleSubmitBooking = (e) => {
        e.preventDefault();
        if (!validateEgyptianPhone(phone)) {
          setPhoneError('يرجى إدخال رقم هاتف مصري صحيح مكون من 11 رقم ويبدأ بـ (010, 011, 012, 015)');
          return;
        }
        setPhoneError('');
        if (!chosenService) { return; }

        const newBooking = {
          id: 'BK-' + Math.floor(1000 + Math.random() * 9000),
          customerName,
          phone,
          serviceId: chosenService.id,
          serviceName: chosenService.name,
          price: chosenService.price,
          date: selectedDate,
          time: selectedTime,
          status: 'معلق',
          notes
        };

        onBookingCreated(newBooking);
        setConfirmedBooking(newBooking);
        setStep(4); // Confirmation step
      };

      const formatWhatsAppMessage = (bk) => {
        const text = `أهلاً حلاق محمد شرود، أود تأكيد حجزي عبر الموقع:
📌 الاسم: ${bk.customerName}
📞 الهاتف: ${bk.phone}
✂️ الخدمة: ${bk.serviceName} (${bk.price} ج.م)
📅 التاريخ: ${bk.date}
⏰ الموعد: ${bk.time}
📝 ملاحظات: ${bk.notes || 'لا يوجد'}`;
        return `https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(text)}`;
      };

      return (
        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
          
          <div className="text-center max-w-xl mx-auto space-y-2">
            <h2 className="text-3xl font-extrabold text-white">حجز موعد أونلاين</h2>
            <p className="text-gray-400 text-sm">احجز حلاقتك القادمة بكل سهولة واضمن عدم الانتظار في الصالون</p>
          </div>

          {/* Stepper Header */}
          {step < 4 && (
            <div className="flex justify-center items-center gap-4 sm:gap-8 pb-4">
              {[
                { num: 1, label: 'اختيار الخدمة' },
                { num: 2, label: 'التاريخ والموعد' },
                { num: 3, label: 'بيانات العميل' },
              ].map((s) => (
                <div key={s.num} className="flex items-center gap-2">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                    step === s.num ? 'bg-gold-500 text-dark-900 shadow-lg' : step > s.num ? 'bg-emerald-600 text-white' : 'bg-dark-800 text-gray-500 border border-dark-700'
                  }`}>
                    {step > s.num ? <i className="fa-solid fa-check"></i> : s.num}
                  </div>
                  <span className={`text-xs font-bold hidden sm:inline ${step === s.num ? 'text-gold-400' : 'text-gray-400'}`}>{s.label}</span>
                </div>
              ))}
            </div>
          )}

          {/* STEP 1: SELECT SERVICE */}
          {step === 1 && (
            <div className="glass-card rounded-2xl p-6 space-y-6">
              <h3 className="font-bold text-lg text-gold-400 border-r-2 border-gold-500 pr-3">1. اختر الخدمة المطلوبة</h3>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {services.filter(s => s.active).map((srv) => (
                  <div
                    key={srv.id}
                    onClick={() => setChosenService(srv)}
                    className={`p-4 rounded-xl border cursor-pointer transition flex items-center justify-between ${
                      chosenService?.id === srv.id
                        ? 'border-gold-500 bg-gold-500/10 shadow-lg'
                        : 'border-dark-700 bg-dark-800/60 hover:border-gold-500/40'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <img src={srv.image} alt={srv.name} className="w-14 h-14 rounded-lg object-cover" />
                      <div>
                        <h4 className="font-bold text-sm text-white">{srv.name}</h4>
                        <p className="text-xs text-gray-400">{srv.duration} دقيقة</p>
                      </div>
                    </div>
                    <div className="text-left">
                      <span className="font-extrabold text-gold-400 text-sm">{srv.price} ج.م</span>
                    </div>
                  </div>
                ))}
              </div>

              <div className="flex justify-end pt-4">
                <button
                  disabled={!chosenService}
                  onClick={() => setStep(2)}
                  className="gold-button px-8 py-3 rounded-xl font-bold text-sm flex items-center gap-2 disabled:opacity-50"
                >
                  <span>التالي: اختر الموعد</span>
                  <i className="fa-solid fa-arrow-left"></i>
                </button>
              </div>
            </div>
          )}

          {/* STEP 2: SELECT DATE & TIME */}
          {step === 2 && (
            <div className="glass-card rounded-2xl p-6 space-y-6">
              <h3 className="font-bold text-lg text-gold-400 border-r-2 border-gold-500 pr-3">2. اختر اليوم والوقت المتاح</h3>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-2">تاريخ الحجز</label>
                  <input
                    type="date"
                    min={new Date().toISOString().split('T')[0]}
                    value={selectedDate}
                    onChange={(e) => setSelectedDate(e.target.value)}
                    className="w-full bg-dark-800 border border-gold-500/30 rounded-xl p-3 text-white focus:outline-none focus:border-gold-500 text-sm"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-2">الأوقات المتاحة لهذا اليوم</label>
                  <div className="grid grid-cols-3 gap-2">
                    {availableTimeSlots.map((slot) => (
                      <button
                        key={slot.time}
                        disabled={slot.isBooked}
                        onClick={() => setSelectedTime(slot.time)}
                        className={`p-2.5 rounded-lg text-xs font-bold border transition ${
                          slot.isBooked
                            ? 'bg-rose-900/20 border-rose-900/40 text-rose-500 cursor-not-allowed line-through'
                            : selectedTime === slot.time
                            ? 'bg-gold-500 text-dark-900 border-gold-500 font-extrabold shadow'
                            : 'bg-dark-800 text-gray-300 border-dark-700 hover:border-gold-500/40'
                        }`}
                      >
                        {slot.time} {slot.isBooked && '(محجوز)'}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center pt-4">
                <button
                  onClick={() => setStep(1)}
                  className="bg-dark-800 text-gray-400 hover:text-white px-6 py-3 rounded-xl font-bold text-sm"
                >
                  الرجوع
                </button>
                <button
                  disabled={!selectedTime}
                  onClick={() => setStep(3)}
                  className="gold-button px-8 py-3 rounded-xl font-bold text-sm flex items-center gap-2 disabled:opacity-50"
                >
                  <span>التالي: إدخال البيانات</span>
                  <i className="fa-solid fa-arrow-left"></i>
                </button>
              </div>
            </div>
          )}

          {/* STEP 3: CUSTOMER DETAILS & VALIDATION */}
          {step === 3 && (
            <form onSubmit={handleSubmitBooking} className="glass-card rounded-2xl p-6 space-y-6">
              <h3 className="font-bold text-lg text-gold-400 border-r-2 border-gold-500 pr-3">3. تفاصيل العميل والتأكيد</h3>

              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-2">الاسم بالكامل *</label>
                  <input
                    type="text"
                    required
                    placeholder="أدخل اسمك الثلاثي"
                    value={customerName}
                    onChange={(e) => setCustomerName(e.target.value)}
                    className="w-full bg-dark-800 border border-gold-500/30 rounded-xl p-3 text-white focus:outline-none focus:border-gold-500 text-sm"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-2">رقم الهاتف (واتساب) *</label>
                  <input
                    type="tel"
                    required
                    placeholder="01012345678"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    className="w-full bg-dark-800 border border-gold-500/30 rounded-xl p-3 text-white focus:outline-none focus:border-gold-500 text-sm dir-ltr text-right"
                  />
                  {phoneError && <p className="text-xs text-rose-400 mt-1">{phoneError}</p>}
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-2">ملاحظات إضافية (اختياري)</label>
                  <textarea
                    rows="3"
                    placeholder="أي تفاصيل خاصة ترغب في إبلاغ الحلاق بها..."
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    className="w-full bg-dark-800 border border-gold-500/30 rounded-xl p-3 text-white focus:outline-none focus:border-gold-500 text-sm"
                  ></textarea>
                </div>
              </div>

              {/* Booking Summary Box */}
              <div className="bg-dark-800/80 p-4 rounded-xl border border-gold-500/20 space-y-2 text-xs">
                <div className="flex justify-between text-gray-300">
                  <span>الخدمة المختارة:</span>
                  <span className="font-bold text-gold-400">{chosenService?.name}</span>
                </div>
                <div className="flex justify-between text-gray-300">
                  <span>التاريخ والوقت:</span>
                  <span className="font-bold text-white">{selectedDate} الساعة {selectedTime}</span>
                </div>
                <div className="flex justify-between text-gray-300">
                  <span>إجمالي السعر:</span>
                  <span className="font-extrabold text-gold-400 text-sm">{chosenService?.price} ج.م</span>
                </div>
              </div>

              <div className="flex justify-between items-center pt-2">
                <button
                  type="button"
                  onClick={() => setStep(2)}
                  className="bg-dark-800 text-gray-400 hover:text-white px-6 py-3 rounded-xl font-bold text-sm"
                >
                  الرجوع
                </button>
                <button
                  type="submit"
                  className="gold-button px-8 py-3 rounded-xl font-extrabold text-sm flex items-center gap-2 shadow-lg"
                >
                  <i className="fa-solid fa-circle-check"></i>
                  <span>تأكيد الحجز النهائي</span>
                </button>
              </div>
            </form>
          )}

          {/* STEP 4: CONFIRMATION & WHATSAPP ACTION */}
          {step === 4 && confirmedBooking && (
            <div className="glass-card rounded-2xl p-8 text-center space-y-6 animate-fade-in border-2 border-emerald-500/40">
              <div className="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl">
                <i className="fa-solid fa-circle-check"></i>
              </div>

              <div className="space-y-2">
                <h3 className="text-2xl font-extrabold text-white">تم استلام طلب الحجز بنجاح!</h3>
                <p className="text-xs text-gray-400">كود الحجز المرجعي: <span className="text-gold-400 font-mono font-bold">{confirmedBooking.id}</span></p>
              </div>

              <div className="bg-dark-800 p-4 rounded-xl border border-gold-500/20 text-right space-y-2 text-xs max-w-md mx-auto">
                <p className="text-gray-300"><strong className="text-white">الاسم:</strong> {confirmedBooking.customerName}</p>
                <p className="text-gray-300"><strong className="text-white">الخدمة:</strong> {confirmedBooking.serviceName}</p>
                <p className="text-gray-300"><strong className="text-white">الموعد:</strong> {confirmedBooking.date} الساعة {confirmedBooking.time}</p>
                <p className="text-gray-300"><strong className="text-white">المبلغ المطلوب:</strong> {confirmedBooking.price} ج.م</p>
              </div>

              <div className="pt-2 flex flex-col sm:flex-row justify-center gap-4">
                <a
                  href={formatWhatsAppMessage(confirmedBooking)}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg"
                >
                  <i className="fa-brands fa-whatsapp text-lg"></i>
                  <span>إرسال التفاصيل مباشرة عبر واتساب</span>
                </a>

                <button
                  onClick={() => {
                    setStep(1);
                    setCustomerName('');
                    setPhone('');
                    setNotes('');
                  }}
                  className="bg-dark-800 hover:bg-dark-700 text-gray-300 px-6 py-3.5 rounded-xl font-bold text-sm border border-gold-500/20"
                >
                  حجز موعد جديد
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // 1. BOOKINGS PANEL
    function AdminBookingsPanel({ bookings, setBookings, services, showToast }) {
      const [filterStatus, setFilterStatus] = useState('الكل');
      const [searchQuery, setSearchQuery] = useState('');
      const [showManualModal, setShowManualModal] = useState(false);

      // Manual booking form
      const [mName, setMName] = useState('');
      const [mPhone, setMPhone] = useState('');
      const [mService, setMService] = useState(services[0] || null);
      const [mDate, setMDate] = useState(new Date().toISOString().split('T')[0]);
      const [mTime, setMTime] = useState('17:00');

      const filteredBookings = bookings.filter(b => {
        const matchesStatus = filterStatus === 'الكل' || b.status === filterStatus;
        const matchesQuery = b.customerName.includes(searchQuery) || b.phone.includes(searchQuery);
        return matchesStatus && matchesQuery;
      });

      const handleUpdateStatus = (id, newStatus) => {
        setBookings(bookings.map(b => b.id === id ? { ...b, status: newStatus } : b));
        showToast(`تم تغيير حالة الحجز إلى: ${newStatus}`);
      };

      const handleDeleteBooking = (id) => {
        if (confirm('هل أنت تأكد من حذف هذا الحجز؟')) {
          setBookings(bookings.filter(b => b.id !== id));
          showToast('تم حذف الحجز بنجاح');
        }
      };

      const handleAddManualBooking = (e) => {
        e.preventDefault();
        if (!mService) { showToast('أضف خدمة أولاً', 'error'); return; }
        const newBk = {
          id: 'BK-' + Math.floor(1000 + Math.random() * 9000),
          customerName: mName,
          phone: mPhone,
          serviceId: mService.id,
          serviceName: mService.name,
          price: mService.price,
          date: mDate,
          time: mTime,
          status: 'مؤكد',
          notes: 'حجز يدوي بواسطة الصالون'
        };
        setBookings([newBk, ...bookings]);
        setShowManualModal(false);
        showToast('تم إضافة الحجز اليدوي بنجاح');
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap justify-between items-center gap-4">
            <h3 className="font-extrabold text-xl text-white">إدارة كافة الحجوزات</h3>
            <button
              onClick={() => setShowManualModal(true)}
              className="gold-button px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2"
            >
              <i className="fa-solid fa-plus"></i>
              <span>إضافة حجز يدوي (تليفون)</span>
            </button>
          </div>

          {/* Filters & Search */}
          <div className="glass-card p-4 rounded-xl flex flex-wrap gap-4 items-center justify-between">
            <input
              type="text"
              placeholder="بحث باسم العميل أو رقم الهاتف..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="bg-dark-800 border border-dark-700 rounded-xl px-4 py-2 text-xs text-white w-full sm:w-64 focus:outline-none focus:border-gold-500"
            />

            <div className="flex items-center gap-2 overflow-x-auto">
              {['الكل', 'معلق', 'مؤكد', 'مكتمل', 'ملغي'].map((st) => (
                <button
                  key={st}
                  onClick={() => setFilterStatus(st)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                    filterStatus === st ? 'bg-gold-500 text-dark-900' : 'bg-dark-800 text-gray-400'
                  }`}
                >
                  {st}
                </button>
              ))}
            </div>
          </div>

          {/* Table */}
          <div className="glass-card rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-right">
                <thead className="bg-dark-800 text-gray-400 border-b border-dark-700">
                  <tr>
                    <th className="p-3">الكود</th>
                    <th className="p-3">العميل</th>
                    <th className="p-3">الهاتف</th>
                    <th className="p-3">الخدمة</th>
                    <th className="p-3">الموعد</th>
                    <th className="p-3">السعر</th>
                    <th className="p-3">الحالة</th>
                    <th className="p-3 text-center">إجراءات</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-dark-800">
                  {filteredBookings.map((b) => (
                    <tr key={b.id} className="hover:bg-dark-800/40">
                      <td className="p-3 font-mono text-gold-400 font-bold">{b.id}</td>
                      <td className="p-3 font-bold text-white">{b.customerName}</td>
                      <td className="p-3 font-mono text-gray-300 dir-ltr text-right">{b.phone}</td>
                      <td className="p-3 text-gray-300">{b.serviceName}</td>
                      <td className="p-3 text-gray-300">{b.date} ({b.time})</td>
                      <td className="p-3 font-bold text-gold-400">{b.price} ج.م</td>
                      <td className="p-3">
                        <select
                          value={b.status}
                          onChange={(e) => handleUpdateStatus(b.id, e.target.value)}
                          className="bg-dark-900 border border-gold-500/30 rounded px-2 py-1 text-[11px] font-bold text-gold-400 focus:outline-none"
                        >
                          <option value="معلق">معلق</option>
                          <option value="مؤكد">مؤكد</option>
                          <option value="مكتمل">مكتمل</option>
                          <option value="ملغي">ملغي</option>
                        </select>
                      </td>
                      <td className="p-3 text-center">
                        <div className="flex justify-center items-center gap-2">
                          <a
                            href={`https://wa.me/${b.phone}`}
                            target="_blank"
                            rel="noreferrer"
                            className="w-7 h-7 bg-emerald-600/30 text-emerald-400 rounded flex items-center justify-center hover:bg-emerald-600 hover:text-white transition"
                            title="واتساب العميل"
                          >
                            <i className="fa-brands fa-whatsapp"></i>
                          </a>
                          <a
                            href={`tel:${b.phone}`}
                            className="w-7 h-7 bg-blue-600/30 text-blue-400 rounded flex items-center justify-center hover:bg-blue-600 hover:text-white transition"
                            title="اتصال مباشر"
                          >
                            <i className="fa-solid fa-phone"></i>
                          </a>
                          <button
                            onClick={() => handleDeleteBooking(b.id)}
                            className="w-7 h-7 bg-rose-600/30 text-rose-400 rounded flex items-center justify-center hover:bg-rose-600 hover:text-white transition"
                            title="حذف الحجز"
                          >
                            <i className="fa-solid fa-trash"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Manual Booking Modal */}
          {showManualModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="glass-card p-6 rounded-2xl max-w-md w-full space-y-4">
                <h3 className="font-bold text-lg text-gold-400">إضافة حجز يدوي جديد</h3>
                <form onSubmit={handleAddManualBooking} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-gray-300 mb-1">اسم العميل</label>
                    <input type="text" required value={mName} onChange={(e) => setMName(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-300 mb-1">رقم الهاتف</label>
                    <input type="tel" required value={mPhone} onChange={(e) => setMPhone(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white text-right dir-ltr" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-300 mb-1">الخدمة</label>
                    <select value={mService?.id} onChange={(e) => setMService(services.find(s => s.id === e.target.value))} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white">
                      {services.map(s => <option key={s.id} value={s.id}>{s.name} ({s.price} ج.م)</option>)}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-gray-300 mb-1">التاريخ</label>
                      <input type="date" value={mDate} onChange={(e) => setMDate(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-300 mb-1">الموعد</label>
                      <input type="time" value={mTime} onChange={(e) => setMTime(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowManualModal(false)} className="px-4 py-2 bg-dark-800 text-gray-400 rounded-lg text-xs">إلغاء</button>
                    <button type="submit" className="gold-button px-4 py-2 rounded-lg text-xs font-bold">إضافة الحجز</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // 2. SERVICES PANEL
    function AdminServicesPanel({ services, setServices, showToast }) {
      const [showModal, setShowModal] = useState(false);
      const [editService, setEditService] = useState(null);

      const [name, setName] = useState('');
      const [category, setCategory] = useState('شعر');
      const [price, setPrice] = useState(100);
      const [duration, setDuration] = useState(30);
      const [image, setImage] = useState('');
      const [description, setDescription] = useState('');

      const openAddModal = () => {
        setEditService(null);
        setName('');
        setCategory('شعر');
        setPrice(100);
        setDuration(30);
        setImage('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=600&q=80');
        setDescription('');
        setShowModal(true);
      };

      const openEditModal = (srv) => {
        setEditService(srv);
        setName(srv.name);
        setCategory(srv.category);
        setPrice(srv.price);
        setDuration(srv.duration);
        setImage(srv.image);
        setDescription(srv.description);
        setShowModal(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (editService) {
          setServices(services.map(s => s.id === editService.id ? {
            ...s, name, category, price: Number(price), duration: Number(duration), image, description
          } : s));
          showToast('تم تعديل الخدمة بنجاح');
        } else {
          setServices([...services, {
            id: 'srv-' + Date.now(),
            name, category, price: Number(price), duration: Number(duration), image, description, active: true
          }]);
          showToast('تمت إضافة الخدمة الجديدة');
        }
        setShowModal(false);
      };

      const toggleActive = (id) => {
        setServices(services.map(s => s.id === id ? { ...s, active: !s.active } : s));
        showToast('تم تغيير حالة الخدمة');
      };

      const handleDelete = (id) => {
        if (confirm('هل ترغب بحذف هذه الخدمة؟')) {
          setServices(services.filter(s => s.id !== id));
          showToast('تم الحذف بنجاح');
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h3 className="font-extrabold text-xl text-white">إدارة قائمة الخدمات والأسعار</h3>
            <button onClick={openAddModal} className="gold-button px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2">
              <i className="fa-solid fa-plus"></i>
              <span>إضافة خدمة جديدة</span>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {services.map(srv => (
              <div key={srv.id} className="glass-card p-4 rounded-xl flex items-center justify-between border border-dark-700">
                <div className="flex items-center gap-3">
                  <img src={srv.image} alt={srv.name} className="w-12 h-12 rounded-lg object-cover" />
                  <div>
                    <h4 className="font-bold text-sm text-white">{srv.name}</h4>
                    <span className="text-xs text-gold-400 font-bold">{srv.price} ج.م</span>
                    <span className="text-[10px] text-gray-500 mr-2">({srv.duration} د)</span>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={() => toggleActive(srv.id)} className={`px-2 py-1 rounded text-[10px] font-bold ${srv.active ? 'bg-emerald-900/40 text-emerald-400' : 'bg-gray-800 text-gray-500'}`}>
                    {srv.active ? 'مفعلة' : 'معطلة'}
                  </button>
                  <button onClick={() => openEditModal(srv)} className="p-1.5 text-gray-400 hover:text-gold-400"><i className="fa-solid fa-pen"></i></button>
                  <button onClick={() => handleDelete(srv.id)} className="p-1.5 text-gray-400 hover:text-rose-400"><i className="fa-solid fa-trash"></i></button>
                </div>
              </div>
            ))}
          </div>

          {/* Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="glass-card p-6 rounded-2xl max-w-md w-full space-y-4">
                <h3 className="font-bold text-lg text-gold-400">{editService ? 'تعديل خدمة' : 'إضافة خدمة جديدة'}</h3>
                <form onSubmit={handleSave} className="space-y-3">
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">اسم الخدمة</label>
                    <input type="text" required value={name} onChange={e => setName(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs text-gray-300 mb-1">التصنيف</label>
                      <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white">
                        <option value="شعر">شعر</option>
                        <option value="ذقن">ذقن</option>
                        <option value="العناية بالبشرة">العناية بالبشرة</option>
                        <option value="باقات شاملة">باقات شاملة</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-gray-300 mb-1">السعر (ج.م)</label>
                      <input type="number" required value={price} onChange={e => setPrice(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">المدة (بالدقائق)</label>
                    <input type="number" required value={duration} onChange={e => setDuration(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">رابط الصورة (URL)</label>
                    <input type="text" required value={image} onChange={e => setImage(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white dir-ltr text-right" />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">الوصف</label>
                    <textarea rows="2" value={description} onChange={e => setDescription(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-lg p-2.5 text-xs text-white"></textarea>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 bg-dark-800 text-gray-400 rounded-lg text-xs">إلغاء</button>
                    <button type="submit" className="gold-button px-4 py-2 rounded-lg text-xs font-bold">حفظ البيانات</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 3. CUSTOMERS PANEL
    function AdminCustomersPanel({ customers, setCustomers, showToast }) {
      return (
        <div className="space-y-6">
          <h3 className="font-extrabold text-xl text-white">قائمة العملاء الدائمين</h3>
          <div className="glass-card rounded-2xl overflow-hidden">
            <table className="w-full text-xs text-right">
              <thead className="bg-dark-800 text-gray-400">
                <tr>
                  <th className="p-3">الاسم</th>
                  <th className="p-3">رقم الهاتف</th>
                  <th className="p-3">عدد الزيارات</th>
                  <th className="p-3">إجمالي المدفوعات</th>
                  <th className="p-3">ملاحظات العميل</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-dark-800">
                {customers.map(c => (
                  <tr key={c.id}>
                    <td className="p-3 font-bold text-white">{c.name}</td>
                    <td className="p-3 font-mono text-gray-300">{c.phone}</td>
                    <td className="p-3 text-gold-400 font-bold">{c.visits} زيارات</td>
                    <td className="p-3 text-emerald-400 font-bold">{c.totalSpent} ج.م</td>
                    <td className="p-3 text-gray-400">{c.notes}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // 4. GALLERY PANEL
    function AdminGalleryPanel({ gallery, setGallery, showToast }) {
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('قصات شعر');
      const [image, setImage] = useState('');

      const handleAddImage = (e) => {
        e.preventDefault();
        setGallery([...gallery, {
          id: 'gal-' + Date.now(),
          title, category, image
        }]);
        showToast('تم إضافة الصورة للمعرض');
        setTitle('');
        setImage('');
      };

      return (
        <div className="space-y-6">
          <div className="glass-card p-6 rounded-2xl space-y-4">
            <h3 className="font-bold text-lg text-gold-400">إضافة صورة جديدة للمعرض</h3>
            <form onSubmit={handleAddImage} className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <input type="text" placeholder="عنوان الصورة" required value={title} onChange={e => setTitle(e.target.value)} className="bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white" />
              <select value={category} onChange={e => setCategory(e.target.value)} className="bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white">
                <option value="قصات شعر">قصات شعر</option>
                <option value="تحديد ذقن">تحديد ذقن</option>
                <option value="قبل وبعد">قبل وبعد</option>
              </select>
              <input type="text" placeholder="رابط الصورة (URL)" required value={image} onChange={e => setImage(e.target.value)} className="bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white dir-ltr text-right" />
              <button type="submit" className="md:col-span-3 gold-button py-2.5 rounded-xl font-bold text-xs">إضافة للمعرض</button>
            </form>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {gallery.map(item => (
              <div key={item.id} className="glass-card p-2 rounded-xl relative group">
                <img src={item.image} alt={item.title} className="w-full h-32 object-cover rounded-lg" />
                <p className="text-xs font-bold text-white mt-2">{item.title}</p>
                <button 
                  onClick={() => {
                    setGallery(gallery.filter(g => g.id !== item.id));
                    showToast('تم حذف الصورة');
                  }}
                  className="absolute top-3 left-3 bg-rose-600 text-white p-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition text-xs"
                >
                  <i className="fa-solid fa-trash"></i>
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 5. REVIEWS PANEL
    function AdminReviewsPanel({ reviews, setReviews, showToast }) {
      const handleToggleApprove = (id) => {
        setReviews(reviews.map(r => r.id === id ? { ...r, status: r.status === 'approved' ? 'hidden' : 'approved' } : r));
        showToast('تم تغيير حالة التقييم');
      };

      return (
        <div className="space-y-6">
          <h3 className="font-extrabold text-xl text-white">إدارة تقييمات العملاء</h3>
          <div className="space-y-3">
            {reviews.map(rev => (
              <div key={rev.id} className="glass-card p-4 rounded-xl flex items-center justify-between border border-dark-700">
                <div>
                  <h4 className="font-bold text-sm text-white">{rev.name} <span className="text-gold-400 text-xs">({rev.rating} نجوم)</span></h4>
                  <p className="text-xs text-gray-400 mt-1">"{rev.comment}"</p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => handleToggleApprove(rev.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold ${rev.status === 'approved' ? 'bg-emerald-900/40 text-emerald-400' : 'bg-gray-800 text-gray-400'}`}
                  >
                    {rev.status === 'approved' ? 'معروض' : 'مخفي'}
                  </button>
                  <button
                    onClick={() => {
                      setReviews(reviews.filter(r => r.id !== rev.id));
                      showToast('تم حذف التقييم');
                    }}
                    className="p-2 text-rose-400 hover:text-rose-300"
                  >
                    <i className="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 6. SETTINGS PANEL
    function AdminSettingsPanel({ settings, setSettings, showToast }) {
      const [formData, setFormData] = useState({ ...settings });

      const handleSave = (e) => {
        e.preventDefault();
        setSettings(formData);
        showToast('تم حفظ إعدادات الموقع بنجاح');
      };

      return (
        <form onSubmit={handleSave} className="glass-card p-6 rounded-2xl space-y-4 max-w-2xl">
          <h3 className="font-bold text-lg text-gold-400">إعدادات صالون الحلاق العامة</h3>
          
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="block text-xs font-bold text-gray-300 mb-1">رقم الهاتف التواصل</label>
              <input type="text" value={formData.phone} onChange={e => setFormData({ ...formData, phone: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white" />
            </div>

            <div>
              <label className="block text-xs font-bold text-gray-300 mb-1">رقم الواتساب (بالكود)</label>
              <input type="text" value={formData.whatsapp} onChange={e => setFormData({ ...formData, whatsapp: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white dir-ltr text-right" />
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold text-gray-300 mb-1">العنوان والتفاصيل</label>
            <input type="text" value={formData.address} onChange={e => setFormData({ ...formData, address: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white" />
          </div>

          <div>
            <label className="block text-xs font-bold text-gray-300 mb-1">العنوان الرئيسي في الواجهة (Hero Title)</label>
            <input type="text" value={formData.heroTitle} onChange={e => setFormData({ ...formData, heroTitle: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white" />
          </div>

          <div>
            <label className="block text-xs font-bold text-gray-300 mb-1">كلمة مرور الأدمن</label>
            <input type="text" value={formData.adminPass} onChange={e => setFormData({ ...formData, adminPass: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white font-mono" />
          </div>

          <button type="submit" className="gold-button px-6 py-3 rounded-xl font-bold text-xs shadow">
            حفظ التغييرات
          </button>
        </form>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
